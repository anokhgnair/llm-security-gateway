[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-secgate"
version = "0.4.1"
description = "Local-first LLM security gateway for protecting AI applications and RAG pipelines against prompt injection, sensitive-data leakage, malicious documents, unsafe URLs, and unsafe model outputs."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.9"
authors = [{ name = "LLM-SecGate Maintainers" }]
license = { text = "Apache-2.0" }
dependencies = [
  "pyyaml>=6.0",
  "regex>=2023.10.3"
]

[project.optional-dependencies]
graph = [
  "networkx>=3.2"
]
dev = [
  "pytest>=7.4",
  "networkx>=3.2",
  "httpx>=0.24",
  "jsonschema>=4.0"
]
gateway = [
  "fastapi>=0.100",
  "uvicorn>=0.23",
  "pypdf>=4.0"
]

[tool.setuptools.package-data]
"rag_firewall" = ["schema/*.json"]

[tool.setuptools.packages.find]
include = ["rag_firewall*"]

[project.scripts]
ragfw = "rag_firewall.cli:main"
llm-secgate = "rag_firewall.cli:main"

